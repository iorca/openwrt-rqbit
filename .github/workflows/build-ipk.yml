name: 构建 ipk

on:
  push:
    branches: [master]
    paths:
      # 空提交（保活心跳）不会命中这些路径，因此不会触发无谓的重建。
      - 'rqbit/**'
      - 'luci-app-rqbit/**'
      - 'tools/**'
      - '.github/workflows/build-ipk.yml'
  workflow_dispatch:
  schedule:
    # 每周日 UTC 04:37 触发，再由 gate 决定是否放行（严格每 14 天一次）。
    - cron: '37 4 * * 0'

permissions:
  contents: read

jobs:
  # GitHub 的 cron 无法表达「每 14 天」：写法 "*/14" 落在「日」字段上，
  # 表示每月 1/15/29 号，月末会被截断。改为每周跑一次 + 纪元周数奇偶闸门，
  # 相邻两次运行相差正好 7 天，奇偶必然交替，从而得到严格的 14 天节拍。
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          set -e
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          parity=$(( $(date +%s) / 604800 % 2 ))
          echo "纪元周奇偶=$parity (0=本次执行)"
          echo "run=$([ "$parity" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 为什么不用 OpenWrt SDK：两个包都不需要交叉编译——rqbit 用上游预编译
      # 的静态 musl 二进制，luci-app-rqbit 是纯 JS/Lua 文件。而 SDK 里编译
      # luci-base 的依赖 lucihttp 必然失败：liblucihttp-lua/-ucode 只声明
      # DEPENDS:=+liblua/+libucode（仅库、无头文件），lua.h 与 ucode/module.h
      # 在 SDK 中无法获得（ucode 是 base 包，SDK 不含其源码）。这是 LuCI 上游
      # 的依赖 bug，只有完整 buildroot 能编过。
      - name: 打包
        run: |
          python3 tools/mkipk.py --outdir bin

      - name: 汇总产物
        run: |
          echo "### 构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l bin/ >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 打包脚本会对上游二进制做 sha256 校验，这里再复核一遍包内容可读。
          for f in bin/*.ipk; do
            tar tzf "$f" >/dev/null && echo "OK $f" || { echo "BAD $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rqbit-ipk
          path: bin/*.ipk
          if-no-files-found: error

  # artifact 有 90 天保留期且没有面向用户的下载页，所以每次成功构建后
  # 同步发布成 Release：
  #   * 滚动标签 latest —— 每次 master 构建都更新，始终是最新可用包
  #   * 版本标签 vX.Y.Z —— 由 check-upstream 跟进上游时创建，做正式发布点
  release:
    needs: [gate, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rqbit-ipk
          path: dist

      - name: 更新滚动 Release (latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "最新构建" \
                 --notes "跟随 master 自动更新，文件名中的版本即 rqbit 上游版本。"
          gh release upload latest dist/*.ipk --clobber

      - name: 发布版本 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh release create "${{ github.ref_name }}" dist/*.ipk --generate-notes 2>/dev/null \
            || gh release upload "${{ github.ref_name }}" dist/*.ipk --clobber
